<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}">

<head>
<title>Cargo</title>
<!-- Este será substituído -->
</head>

<body>
	<div layout:fragment="content">
		<div class="container-fluid p-2">
			<div class="row">
				<div class="col-12">
					<nav aria-label="breadcrumb card"
						style="margin-top: -25px; font-size: 0.8rem;">
						<ol class="breadcrumb">
							<li class="breadcrumb-item"><a th:href="@{/home}"> <i
									class="fa-duotone fa-solid fa-house fs-7"></i> Home
							</a></li>
							<li class="breadcrumb-item"><span class="text-muted">
									<i class="fa-duotone fa-id-badge"></i> Cargo
							</span></li>

						</ol>
					</nav>
				</div>
				<div class="col-12" th:replace="~{fragments/componentes :: alertas}"></div>
				<div class="col-12" >
					<div class="card">


							<div th:replace="~{fragments/componentes :: cardHeader(
                                'Cargos',
                                'Gerencie os Cargos',
                                'briefcase',
                                '/construcao',
                                'Cargo',
                                ${isMaster},
                                ${queryParams}
                            )}"></div>


						<div class="card-body">
							<div class="row">
								<div class="col-12">
									<form th:action="@{/cargos}" method="get" class="mb-3">
										<div class="row g-2">

											<div class="col-md-4 input-group-sm">
												<label class="form-label fw-semibold">Descrição do Cargo</label>
												<input type="text"
												       name="filtroDescricao"
												       th:value="${filtro.filtroDescricao}"
												       class="form-control"
												       placeholder="Digite para buscar">
											</div>

											<div class="col-md-2 input-group-sm">
												<label class="form-label fw-semibold">Status</label>
												<select name="filtroStatus" class="form-select">
													<!-- Como o seu DTO tem filtroStatus como String, usamos os valores -->
													<option value="1" th:selected="${filtro.filtroStatus == '1'}">Ativos</option>
													<option value="0" th:selected="${filtro.filtroStatus == '0'}">Inativos</option>
													<option value="" th:selected="${filtro.filtroStatus == null or filtro.filtroStatus == ''}">Todos</option>
												</select>
											</div>

											<!-- LINHAS -->
											<div class="col-md-2 input-group-sm">
												<label class="form-label fw-semibold">Linhas</label>
												<select name="size" class="form-select">
													<option value="10" th:selected="${filtro.size == 10}">10</option>
													<option value="15" th:selected="${filtro.size == 15}">15</option>
													<option value="20" th:selected="${filtro.size == 20}">20</option>
													<option value="25" th:selected="${filtro.size == 25}">25</option>
													<option value="30" th:selected="${filtro.size == 30}">30</option>
												</select>
											</div>


											<div th:replace="~{fragments/componentes :: botoesFiltro('/cargos', 'col-md-4')}"></div>

										</div>
									</form>

								</div>
								<div class="col-12">
									<div class="d-none d-md-block">
										<table class="table table-modern align-middle mb-0">
											<thead>
												<tr>
													<th style="width: 80px;">ID</th>
													<th>Descrição</th>
													<th class="text-center" style="width: 120px;">Status</th>
													<th class="text-center" style="width: 140px;">Ações</th>
												</tr>
											</thead>
											<tbody>
											<tr th:if="${#lists.isEmpty(lista)}">
												<td colspan="6"> <!-- Mudei de 8 para 6, pois sua tabela tem 6 colunas -->
													<div th:replace="~{fragments/componentes :: emptyState('Nenhum registro encontrado com os filtros atuais.')}"></div>
												</td>
											</tr>
											<tr th:each="cargo : ${lista}">

												<td class="fw-semibold text-dark" th:text="${cargo.id}"></td>
												<td class="fw-semibold text-dark" th:text="${cargo.descricao}"></td>

												<td class="text-center"><span
														th:if="${cargo.status == 1}"
														class="badge badge-soft-success badge-lg">
														Ativo </span> <span th:if="${cargo.status == 0}"
												                            class="fa-duotone fa-solid fa-circle-xmark me-1">
														Inativo </span>
												</td>
												<td class="text-center text-nowrap">
													<div th:replace="~{fragments/componentes :: acoes(
													${cargo.id},
													'/cargo',
													${queryParams},
													${isMaster},
													'cargo'
												     )}">
													</div>
												</td>


											</tr>
											</tbody>


										</table>
										<!-- ==================== VERSÃO MOBILE (Cards) ==================== -->
										<div class="d-block d-md-none">

											<!-- Empty state mobile -->
											<div th:if="${#lists.isEmpty(lista)}">
												<div th:replace="~{fragments/componentes :: emptyState('Nenhum registro encontrado com os filtros atuais.')}"></div>
											</div>

											<!-- Card por Cargo -->
											<div class="card card-mobile-modern mb-3" th:each="cargo : ${lista}">
												<div class="card-body p-3">

													<!-- Topo: ID e Status -->
													<div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2">
														<div class="fw-bold text-dark">
															<i class="fa-duotone fa-solid fa-hashtag me-1 text-muted"></i>
															<span th:text="${cargo.id}"></span>
														</div>

														<!-- Status -->
														<div>
                    <span th:if="${cargo.status == 1}" class="badge badge-soft-success">
                        <i class="fa-duotone fa-solid fa-circle-check me-1"></i> Ativo
                    </span>
															<span th:if="${cargo.status == 0}" class="badge badge-soft-danger">
                        <i class="fa-duotone fa-solid fa-circle-xmark me-1"></i> Inativo
                    </span>
														</div>
													</div>

													<!-- Corpo: Descrição -->
													<div class="mb-3">
														<small class="text-muted d-block mb-1">Descrição:</small>
														<div class="fw-semibold text-dark text-truncate" th:text="${cargo.descricao}"></div>
													</div>

													<!-- Ações -->
													<div class="d-flex justify-content-end gap-2 pt-3 border-top">
														<div th:replace="~{fragments/componentes :: acoes(
                    ${cargo.id},
                    '/cargos',
                    ${queryParams},
                    ${isMaster},
                    'cargo'
                )}"></div>
													</div>

												</div>
											</div>
										</div>
									</div>


								</div>
							</div>

						</div>
						<!--paginacao -->
							<div class="card-footer card-footer-modern d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
								<!-- Info à esquerda -->
								<small class="text-muted">
									Página <strong th:text="${cargos.number + 1}"></strong>
									de <strong th:text="${cargos.totalPages}"></strong>
									&bull;
									<span th:text="${cargos.totalElements}"></span> registro(s)
								</small>

								<!-- Paginação à direita -->
								<nav aria-label="Paginação">
									<ul class="pagination pagination-modern mb-0">

										<!-- Primeira -->
										<li class="page-item" th:classappend="${cargos.first} ? 'disabled'">
											<a class="page-link"
											   th:href="@{/cargos(
                                        page=0,
                                        filtroDescricao=${filtro.filtroDescricao},
                                        filtroStatus=${filtro.filtroStatus},
                                        size=${filtro.size})}"
											   data-bs-toggle="tooltip" title="Primeira página">
												<i class="fa-duotone fa-solid fa-angles-left"></i>
											</a>
										</li>

										<!-- Anterior -->
										<li class="page-item" th:classappend="${cargos.first} ? 'disabled'">
											<a class="page-link"
											   th:href="@{/cargos(
                                        page=${cargos.number - 1},
                                        filtroDescricao=${filtro.filtroDescricao},
                                        filtroStatus=${filtro.filtroStatus},
                                        size=${filtro.size})}"
											   data-bs-toggle="tooltip" title="Anterior">
												<i class="fa-duotone fa-solid fa-chevron-left"></i>
											</a>
										</li>

										<!-- Números -->
										<th:block th:if="${cargos.totalPages > 0}">
											<li th:each="i : ${#numbers.sequence(0, cargos.totalPages - 1)}"
											    class="page-item"
											    th:classappend="${i == cargos.number} ? 'active'">
												<a class="page-link"
												   th:href="@{/cargos(
            page=${i},
           filtroDescricao=${filtro.filtroDescricao},
                                        filtroStatus=${filtro.filtroStatus},
                                        size=${filtro.size})}"
												   th:text="${i + 1}"></a>
											</li>
										</th:block>

										<!-- Próxima -->
										<li class="page-item" th:classappend="${cargos.last} ? 'disabled'">
											<a class="page-link"
											   th:href="@{/cargos(
                                        page=${cargos.number + 1},
                                       filtroDescricao=${filtro.filtroDescricao},
                                        filtroStatus=${filtro.filtroStatus},
                                        size=${filtro.size})}"
											   data-bs-toggle="tooltip" title="Próxima">
												<i class="fa-duotone fa-solid fa-chevron-right"></i>
											</a>
										</li>

										<!-- Última -->
										<li class="page-item" th:classappend="${cargos.last} ? 'disabled'">
											<a class="page-link"
											   th:href="@{/cargos(
                                        page=${cargos.totalPages - 1},
                                        filtroDescricao=${filtro.filtroDescricao},
                                        filtroStatus=${filtro.filtroStatus},
                                        size=${filtro.size})}"
											   data-bs-toggle="tooltip" title="Última página">
												<i class="fa-duotone fa-solid fa-angles-right"></i>
											</a>
										</li>

									</ul>
								</nav>

							</div>
					</div>
				</div>

			</div>

		</div>

	</div>
</body>
</html>
