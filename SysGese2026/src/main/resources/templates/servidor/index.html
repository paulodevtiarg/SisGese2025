<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
	<title>Servidores</title>
</head>

<body>
<div layout:fragment="content">

	<div class="container-fluid p-2">
		<div class="row">

			<!-- BREADCRUMB -->
			<div class="col-12">
				<nav aria-label="breadcrumb card" style="margin-top: -25px; font-size: 0.8rem;">
					<ol class="breadcrumb">
						<li class="breadcrumb-item">
							<a th:href="@{/home}">
								<i class="fa-duotone fa-solid fa-house fs-7"></i> Home
							</a>
						</li>
						<li class="breadcrumb-item">
							<span class="text-muted"><i class="fa-duotone fa-solid fa-user-tie"></i> Servidores</span>
						</li>
					</ol>
				</nav>
			</div>

			<div class="col-12" th:replace="~{fragments/componentes :: alertas}"></div>

			<div class="col-12">
				<div class="card">

					<!-- HEADER -->
					<div th:replace="~{fragments/componentes :: cardHeader(
                        'Servidores',
                        'Gerencie os registros de Servidores',
                        'user-tie',
                        '/construcao',
                        'Servidor',
                        ${isMaster},
                        ${queryParams}
                    )}"></div>

					<div class="card-body">
						<div class="row">

							<!-- FILTROS -->
							<div class="col-12">
								<form th:action="@{/servidores}" method="get" class="filter-box mb-2">
									<div class="row g-3">

										<div class="col-md-3">
											<label class="form-label small fw-semibold text-secondary">Nome</label>
											<div class="input-group input-group-modern">
												<span class="input-group-text"><i class="fa-duotone fa-solid fa-user"></i></span>
												<input type="text" name="filtroNome" th:value="${filtro.filtroNome}" class="form-control" placeholder="Digite para buscar">
											</div>
										</div>

										<div class="col-md-2">
											<label class="form-label small fw-semibold text-secondary">Matrícula</label>
											<div class="input-group input-group-modern">
												<span class="input-group-text"><i class="fa-duotone fa-solid fa-id-badge"></i></span>
												<input type="text" name="filtroMatricula" th:value="${filtro.filtroMatricula}" class="form-control" placeholder="Matrícula">
											</div>
										</div>

										<div class="col-md-2">
											<label class="form-label small fw-semibold text-secondary">CPF</label>
											<div class="input-group input-group-modern">
												<span class="input-group-text"><i class="fa-duotone fa-solid fa-id-card"></i></span>
												<input type="text" name="filtroCpf" th:value="${filtro.filtroCpf}" class="form-control" placeholder="000.000.000-00" oninput="mascaraCPF(this)">
											</div>
										</div>
										<div class="col-md-2" th:if="${isMaster}">
											<label class="form-label small fw-semibold text-secondary">Unidade</label>
											<select name="filtroUnidadeId" class="form-select form-control-modern">
												<option value="">Todas</option>
												<option th:each="u : ${unidades}" th:value="${u.id}" th:text="${u.nome}" th:selected="${u.id == filtro.filtroUnidadeId}"></option>
											</select>
										</div>

										<div class="col-md-2">
											<label class="form-label small fw-semibold text-secondary">Status</label>
											<select name="filtroStatus" class="form-select form-control-modern">
												<option value="TODOS" th:selected="${filtro.filtroStatus == null || filtro.filtroStatus == 'TODOS'}">Todos</option>
												<option value="ATIVO" th:selected="${filtro.filtroStatus == 'ATIVO'}">Ativos</option>
												<option value="INATIVO" th:selected="${filtro.filtroStatus == 'INATIVO'}">Inativos</option>
											</select>
										</div>

										<div class="col-md-1">
											<label class="form-label small fw-semibold text-secondary">Linhas</label>
											<select name="size" class="form-select form-control-modern">
												<option value="10" th:selected="${filtro.size == 10}">10</option>
												<option value="15" th:selected="${filtro.size == 15}">15</option>
												<option value="20" th:selected="${filtro.size == 20}">20</option>
												<option value="30" th:selected="${filtro.size == 30}">30</option>
											</select>
										</div>



									</div>
									<div class="row g-3 mt-2">
										<div th:replace="~{fragments/componentes :: botoesFiltro('/servidores', 'col-md-12')}"></div>
									</div>
								</form>
							</div>

							<!-- TABELA DESKTOP -->
							<div class="col-12">
								<div class="d-none d-md-block">
									<table class="table table-modern align-middle mb-0">
										<thead>
										<tr>
											<th class="text-center" style="width: 60px;">Foto</th>
											<th>Servidor</th>
											<th>Matrícula / CPF</th>
											<th>Contato</th>
											<th>Cidade/UF</th>
											<th class="text-center">Status</th>
											<th class="text-center" style="width: 140px;">Ações</th>
										</tr>
										</thead>
										<tbody>
										<tr th:if="${#lists.isEmpty(lista)}">
											<td colspan="7"> <!-- Ajustado para 7 colunas -->
												<div th:replace="~{fragments/componentes :: emptyState('Nenhum servidor encontrado com os filtros atuais.')}"></div>
											</td>
										</tr>

										<tr th:each="servidor : ${lista}">

											<!-- FOTO -->
											<td class="text-center">
												<div class="d-flex justify-content-center">
													<div class="avatar-wrapper" style="width: 40px; height: 40px;">
														<img th:if="${servidor.foto != null}" th:src="${servidor.foto}" class="avatar-img rounded-circle">
														<div th:if="${servidor.foto == null}" class="avatar-fallback rounded-circle">
															<i class="fa-solid fa-user"></i>
														</div>
													</div>
												</div>
											</td>

											<!-- DADOS DO SERVIDOR -->
											<td>
												<div class="fw-semibold text-dark" th:text="${servidor.nome}"></div>
												<small class="text-muted" th:text="${servidor.email}"></small>
											</td>

											<!-- MATRICULA / CPF -->
											<td>
												<div class="fw-semibold" th:text="${servidor.matricula}"></div>
												<small class="text-muted" th:text="${servidor.cpf}"></small>
											</td>

											<!-- CONTATO + UNIDADE -->
											<td>
												<div class="mb-1">
													<i class="fa-solid fa-phone text-muted me-1"></i>
													<span th:text="${servidor.celular != null ? servidor.celular : servidor.telefone}"></span>
												</div>
												<small class="badge badge-soft-primary">
													<i class="fa-duotone fa-solid fa-building me-1"></i>
													<span th:text="${servidor.nomeUnidadeLotacao != null ? servidor.nomeUnidadeLotacao : 'Sem unidade'}"></span>
												</small>
											</td>

											<td th:text="${servidor.cidade != null ? servidor.cidade + ' / ' + servidor.uf : '-'}"></td>

											<!-- STATUS -->
											<td class="text-center">
												<span th:if="${servidor.status == 1}" class="badge badge-soft-success">Ativo</span>
												<span th:if="${servidor.status == 0}" class="badge badge-soft-danger">Inativo</span>
											</td>

											<!-- AÇÕES -->
											<td class="text-center text-nowrap">
												<div th:replace="~{fragments/componentes :: acoes(
                                                    ${servidor.id},
                                                    '/servidores',
                                                    ${queryParams},
                                                    ${isMaster},
                                                    'servidor'
                                                )}"></div>
											</td>
										</tr>
										</tbody>
									</table>
								</div>

								<!-- CARDS MOBILE -->
								<div class="d-block d-md-none">
									<div th:if="${#lists.isEmpty(lista)}">
										<div th:replace="~{fragments/componentes :: emptyState('Nenhum servidor encontrado com os filtros atuais.')}"></div>
									</div>

									<div class="card card-mobile-modern mb-3" th:each="servidor : ${lista}">
										<div class="card-body p-3">

											<div class="d-flex gap-3 border-bottom pb-2 mb-2">

												<!-- FOTO CENTRALIZADA -->
												<div class="d-flex align-items-center">
													<div class="avatar-wrapper avatar-wrapper-lg">
														<img th:if="${servidor.foto != null}" th:src="${servidor.foto}" class="avatar-img rounded-circle">
														<div th:if="${servidor.foto == null}" class="avatar-fallback rounded-circle">
															<i class="fa-solid fa-user"></i>
														</div>
													</div>
												</div>

												<div class="flex-grow-1 min-w-0">
													<div class="fw-bold text-dark text-truncate" th:text="${servidor.nome}"></div>
													<small class="text-muted d-block" th:text="${servidor.email}"></small>
													<small class="text-muted d-block">Matrícula: <span th:text="${servidor.matricula}"></span></small>
												</div>
												<div>
													<span th:if="${servidor.status == 1}" class="badge badge-soft-success">Ativo</span>
													<span th:if="${servidor.status == 0}" class="badge badge-soft-danger">Inativo</span>
												</div>
											</div>

											<!-- INFO: CONTATO E UNIDADE -->
											<div class="mb-2">
												<small class="text-muted d-block mb-1">
													<i class="fa-solid fa-phone me-1"></i>
													<span th:text="${servidor.celular != null ? servidor.celular : servidor.telefone}"></span>
												</small>
												<small class="badge badge-soft-primary">
													<i class="fa-duotone fa-solid fa-building me-1"></i>
													<span th:text="${servidor.nomeUnidadeLotacao != null ? servidor.nomeUnidadeLotacao : 'Sem unidade'}"></span>
												</small>
											</div>

											<div class="d-flex justify-content-end pt-2 border-top">
												<div th:replace="~{fragments/componentes :: acoes(
                                                    ${servidor.id},
                                                    '/servidores',
                                                    ${queryParams},
                                                    ${isMaster},
                                                    'servidor'
                                                )}"></div>
											</div>

										</div>
									</div>
								</div>

							</div>
						</div>
					</div>

					<!-- PAGINAÇÃO -->
					<div class="card-footer card-footer-modern d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
						<small class="text-muted">
							Página <strong th:text="${pagina.number + 1}"></strong>
							de <strong th:text="${pagina.totalPages}"></strong>
							&bull;
							<span th:text="${pagina.totalElements}"></span> registro(s)
						</small>

						<nav aria-label="Paginação">
							<ul class="pagination pagination-modern mb-0">
								<li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
									<a class="page-link" th:href="@{'/servidores?' + ${@urlUtils.servidorQuery(filtro, 0)}}" title="Primeira página">
										<i class="fa-duotone fa-solid fa-angles-left"></i>
									</a>
								</li>
								<li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
									<a class="page-link" th:href="@{'/servidores?' + ${@urlUtils.servidorQuery(filtro, pagina.number - 1)}}" title="Anterior">
										<i class="fa-duotone fa-solid fa-chevron-left"></i>
									</a>
								</li>

								<th:block th:if="${pagina.totalPages > 0}">
									<li th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}" class="page-item" th:classappend="${i == pagina.number} ? 'active'">
										<a class="page-link" th:href="@{'/servidores?' + ${@urlUtils.servidorQuery(filtro, i)}}" th:text="${i + 1}"></a>
									</li>
								</th:block>

								<li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
									<a class="page-link" th:href="@{'/servidores?' + ${@urlUtils.servidorQuery(filtro, pagina.number + 1)}}" title="Próxima">
										<i class="fa-duotone fa-solid fa-chevron-right"></i>
									</a>
								</li>
								<li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
									<a class="page-link" th:href="@{'/servidores?' + ${@urlUtils.servidorQuery(filtro, pagina.totalPages - 1)}}" title="Última página">
										<i class="fa-duotone fa-solid fa-angles-right"></i>
									</a>
								</li>
							</ul>
						</nav>
					</div>

				</div>
			</div>
		</div>
	</div>
</div>
</body>
</html>
