<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">

<head>
    <title>Internações</title>

</head>

<body>
<div layout:fragment="content">

    <div class="container-fluid p-2">
        <div class="row">
            <div class="col-12">
                <nav aria-label="breadcrumb card"
                     style="margin-top: -25px; font-size: 0.8rem;">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a th:href="@{/home}">  <i  class="fa-duotone fa-solid fa-house fs-7"></i> Home  </a>
                        </li>
                        <li class="breadcrumb-item">
                            <span class="text-muted"><i class="fa-duotone fa-solid fa-building-lock"></i>Internações </span>
                        </li>
                    </ol>
                </nav>

            </div>
            <div class="col-12" th:replace="~{fragments/componentes :: alertas}"></div>

            <div class="col-12">
                <div class="card">
                    <div th:replace="~{fragments/componentes :: cardHeader(
						'Internações',
						'Gerencie os registros de Internações',
						'hands-holding-child',
						'/internacoes/novo',
						'Internação',
						${isMaster},
						${queryParams}
					)}">

                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-12">
                                <form th:action="@{/internacoes}" method="get" class="filter-box mb-2">
                                    <input type="hidden" name="unidadeId" th:value="${unidadeId}">

                                    <div class="row g-2">
                                        <div class="col-md-4">
                                            <label class="form-label small fw-semibold text-secondary">Nome do Adolescente</label>
                                            <div class="input-group input-group-modern">
                                                <span class="input-group-text"><i class="fa-duotone fa-solid fa-user"></i></span>
                                                <input type="text" name="filtroNomeAdolescente" th:value="${filtro.filtroNomeAdolescente}"
                                                       class="form-control" placeholder="Digite para buscar">
                                            </div>
                                        </div>

                                        <div class="col-md-4">
                                            <label class="form-label small fw-semibold text-secondary">Cidade</label>
                                            <div class="input-group input-group-modern">
                                                <span class="input-group-text"><i class="fa-duotone fa-solid fa-tag"></i></span>
                                                <input type="text" name="filtroCidadeAdolescente" th:value="${filtro.filtroCidadeAdolescente}"
                                                       class="form-control" placeholder="Digite para buscar">
                                            </div>
                                        </div>

                                        <div class="col-md-4" th:if="${isMaster}">
                                            <label class="form-label small fw-semibold text-secondary">Unidade</label>
                                            <select name="filtroUnidadeId" class="form-select form-control-modern">
                                                <option value="">Todas</option>
                                                <option th:each="u : ${unidades}" th:value="${u.id}"
                                                        th:text="${u.nome}"
                                                        th:selected="${u.id == filtro.filtroUnidadeId}"></option>
                                            </select>
                                        </div>


                                        <div class="col-md-2" th:if="${!isMaster}">
                                            <label class="form-label small fw-semibold text-secondary">Unidade</label>
                                            <input type="text" class="form-control form-control-modern"
                                                   th:value="${lotacaoUsuarioLogado.unidade.nome}" disabled>
                                        </div>


                                    </div>
                                    <div class="row mt-2">
                                        <div class="col-md-2">
                                            <label class="form-label small fw-semibold text-secondary">Status</label>
                                            <select name="filtroStatus" class="form-select form-control-modern">
                                                <option value="ATIVA"   th:selected="${filtro.filtroStatus == 'ATIVA'}">Ativas</option>
                                                <option value="FINALIZADA"   th:selected="${filtro.filtroStatus == 'FINALIZADA'}">Finalizadas</option>
                                                <option value="CANCELADA" th:selected="${filtro.filtroStatus == 'CANCELADA'}">Canceladas</option>
                                                <option value="TRANSFERIDA" th:selected="${filtro.filtroStatus == 'TRANSFERIDA'}">Transferidas</option>
                                                <option value="TODOS"   th:selected="${filtro.filtroStatus == 'TODOS'}">Todos</option>
                                            </select>
                                        </div>

                                        <div class="col-md-1">
                                            <label class="form-label small fw-semibold text-secondary">Linhas</label>
                                            <select name="size" class="form-select form-control-modern">
                                                <option value="10" th:selected="${filtro.size == 10}">10</option>
                                                <option value="15" th:selected="${filtro.size == 15}">15</option>
                                                <option value="20" th:selected="${filtro.size == 20}">20</option>
                                                <option value="25" th:selected="${filtro.size == 25}">25</option>
                                                <option value="30" th:selected="${filtro.size == 30}">30</option>
                                            </select>
                                        </div>
                                        <div th:replace="~{fragments/componentes :: botoesFiltro('/internacoes', 'col-md-9')}"></div>
                                    </div>
                                </form>

                            </div>
                            <div class="col-12">
                                <div class="d-none d-md-block">
                                    <table class="table table-modern align-middle mb-0">
                                        <thead>
                                        <tr>
                                            <th class="text-center" style="width: 80px;">Foto</th>
                                            <th>Dados</th>
                                            <th>Unidade <small>(cadastro)</small></th>
                                            <th>Unidade <small>(internação)</small></th>
                                            <th>Status da Internação</th>
                                            <th>Início</th>
                                            <th>Fim <small>(provável)</small> </th>
                                             <th class="text-center" style="width: 140px;">Ações</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:if="${internacoes.empty}">
                                            <td colspan="8">
                                                <div th:replace="~{fragments/componentes :: emptyState('Nenhuma internação encontrado com os filtros atuais.')}"></div>
                                            </td>
                                        </tr>

                                        <tr th:each="internacao : ${lista}">
                                            <!--Foto -->
                                            <td class="text-center">
                                                <div class="avatar-wrapper">
                                                    <img th:if="${internacao.fotoAdolescente != null}"
                                                         th:src="${internacao.fotoAdolescente}"
                                                         class="avatar-img" alt="Foto">
                                                    <div th:if="${internacao.fotoAdolescente == null}" class="avatar-fallback">
                                                        <i class="fa-duotone fa-solid fa-user"></i>
                                                    </div>

                                                </div>
                                            </td>
                                            <!--Dados -->
                                            <td>
                                                <div class="fw-semibold text-dark" th:text="${internacao.nomeAdolescente}"></div>
                                                <small class="text-muted d-block">
                                                    <i class="fa-duotone fa-solid fa-location-dot me-1"></i>
                                                    <span th:text="${internacao.cidadeAdolescente +' - '+internacao.ufAdolescente}"></span> &bull;

                                                    <i class="fa-duotone fa-solid fa-cake-candles me-1"></i>
                                                    Idade: <span th:text="${internacao.idadeAdolescente}"></span> anos &bull;
                                                </small>
                                                <small class="text-muted d-block text-truncate" style="max-width: 320px;">
                                                    <i class="fa-duotone fa-solid fa-person-breastfeeding"></i>
                                                    Mãe: <span th:text="${internacao.maeDoAdolescente}"></span>
                                                </small>

                                            </td>
                                            <!--Unidade Cadastro -->
                                            <td th:text="${internacao.nomeUnidadeCadastro}"></td>
                                            <!--Unidade Internação -->
                                            <td th:text="${internacao.nomeUnidadeInternacao}"></td>
                                            <!--Status Internação -->
                                            <td class="text-center">
                                                <th:block th:replace="~{fragments/componentes :: badgeStatusInternacao(${internacao.status.name})}"></th:block>
                                            </td>

                                            <!--Inicio -->
                                            <td th:text="${#temporals.format(internacao.dataInicio, 'dd/MM/yyyy')}"></td>
                                            <!--Fim -->
                                            <td th:text="${internacao.dataPrevisaoSaida != null ? #temporals.format(internacao.dataPrevisaoSaida, 'dd/MM/yyyy') : '-'}"></td>

                                            <td class="text-center text-nowrap">
                                                <div th:replace="~{fragments/componentes :: acoes(
													${internacao.id},
													'/internacoes',
													${queryParams},
													${isMaster},
													'internacao'
												     )}">
                                                </div>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="d-block d-md-none">

                                    <!-- Empty state -->
                                    <div th:if="${adolescentes.empty}"
                                         th:replace="~{fragments/componentes :: emptyState('Nenhuma Internação encontrada com os filtros atuais.')}">
                                    </div>

                                    <div class="card card-mobile-modern mb-3" th:each="internacao : ${lista}">
                                        <div class="card-body p-3">

                                            <div class="d-flex gap-3">

                                                <!-- FOTO + STATUS DOT -->
                                                <div class="avatar-wrapper avatar-wrapper-lg">
                                                    <img th:if="${internacao.fotoAdolescente != null}"
                                                         th:src="${internacao.fotoAdolescente}"
                                                         class="avatar-img" alt="Foto">
                                                    <div th:if="${internacao.fotoAdolescente == null}" class="avatar-fallback">
                                                        <i class="fa-duotone fa-solid fa-user"></i>
                                                    </div>

                                                </div>

                                                <!-- DADOS -->
                                                <div class="flex-grow-1 min-w-0">

                                                    <div class="fw-bold text-dark text-truncate" th:text="${internacao.nomeAdolescente}"></div>

                                                    <small class="text-muted d-block">
                                                        <i class="fa-duotone fa-solid fa-cake-candles me-1"></i>
                                                        <span th:text="${internacao.idadeAdolescente}"></span> anos
                                                        &bull;
                                                        <i class="fa-duotone fa-solid fa-location-dot me-1"></i>
                                                        <span th:text="${internacao.cidadeAdolescente}"></span>/<span th:text="${internacao.ufAdolescente}"></span>
                                                    </small>

                                                    <small class="text-muted d-block text-truncate">
                                                        <i class="fa-duotone fa-solid fa-person-breastfeeding"></i>
                                                        <span th:text="${internacao.maeDoAdolescente}"></span>
                                                    </small>

                                                    <!-- UNIDADES -->
                                                    <small class="text-muted d-block text-truncate">
                                                        <i class="fa-duotone fa-solid fa-buildings"></i>
                                                        <span th:text="${internacao.nomeUnidadeCadastro}"></span>
                                                    </small>
                                                    <small class="text-muted d-block text-truncate">
                                                        <i class="fa-duotone fa-solid fa-building-circle-check"></i>
                                                        <span th:text="${internacao.nomeUnidadeInternacao}"></span>  &bull;
                                                   </small>
                                                    <!-- DATAS -->
                                                    <small class="text-muted d-block text-truncate">
                                                        <i class="fa-duotone fa-solid fa-calendar-days"></i>
                                                        <span   th:text="${#temporals.format(internacao.dataInicio, 'dd/MM/yyyy')}"></span>
                                                        •
                                                        <i class="fa-duotone fa-solid fa-calendar-range"></i>
                                                        <span th:text="${internacao.dataPrevisaoSaida != null ? #temporals.format(internacao.dataPrevisaoSaida, 'dd/MM/yyyy') : '-'}"></span>
                                                    </small>

                                                </div>

                                            </div>

                                            <!-- BADGES -->
                                            <div class="d-flex flex-wrap gap-1 mt-2">
                                                <span class="badge fw-semibold"
                                                      th:classappend="${internacao.status.name() == 'ATIVA' ? 'badge-soft-success badge-lg' :
																			   internacao.status.name() == 'FINALIZADA' ? 'badge-soft-secondary badge-lg' :
																			   internacao.status.name() == 'CANCELADA' ? 'badge-soft-danger badge-lg' :
																			   'badge-soft-warning badge-lg'}"
                                                      th:text="${internacao.status.descricao}">
														</span>
                                            </div>

                                            <!-- AÇÕES -->
                                            <div class="d-flex justify-content-end gap-2 mt-3 pt-3 border-top">
                                                <div th:replace="~{fragments/componentes :: acoes(
                                                    ${internacao.id},
                                                    '/internacoes',
                                                    ${queryParams},
                                                    ${isMaster},
                                                    'internacao'
                                                )}">
                                                </div>
                                            </div>

                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="card-footer card-footer-modern d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">

                        <!-- Info à esquerda -->
                        <small class="text-muted">
                            Página <strong th:text="${internacoes.number + 1}"></strong>
                            de <strong th:text="${internacoes.totalPages}"></strong>
                            &bull;
                            <span th:text="${internacoes.totalElements}"></span> registro(s)
                        </small>



                        <!-- Paginação à direita -->
                        <nav aria-label="Paginação">
                            <ul class="pagination pagination-modern mb-0">

                                <!-- Primeira -->
                                <li class="page-item" th:classappend="${internacoes.first} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/internacoes(
                                        page=0,
                                        filtroNomeAdolescente=${filtro.filtroNomeAdolescente},
                                        filtroCidadeAdolescente=${filtro.filtroCidadeAdolescente},
                                        filtroUnidadeId = ${filtro.filtroUnidadeId},
                                        filtroStatus=${filtro.filtroStatus},
                                        size=${filtro.size})}"
                                       data-bs-toggle="tooltip" title="Primeira página">
                                        <i class="fa-duotone fa-solid fa-angles-left"></i>
                                    </a>
                                </li>

                                <!-- Anterior -->
                                <li class="page-item" th:classappend="${internacoes.first} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/internacoes(
                                        page=${internacoes.number - 1},
                                        filtroNomeAdolescente=${filtro.filtroNomeAdolescente},
                                        filtroCidadeAdolescente=${filtro.filtroCidadeAdolescente},
                                        filtroUnidadeId = ${filtro.filtroUnidadeId},
                                        filtroStatus=${filtro.filtroStatus},
                                        size=${filtro.size})}"
                                       data-bs-toggle="tooltip" title="Anterior">
                                        <i class="fa-duotone fa-solid fa-chevron-left"></i>
                                    </a>
                                </li>

                                <!-- Números -->
                                <th:block th:if="${internacoes.totalPages > 0}">
                                    <li th:each="i : ${#numbers.sequence(0, internacoes.totalPages - 1)}"
                                        class="page-item"
                                        th:classappend="${i == internacoes.number} ? 'active'">
                                        <a class="page-link"
                                           th:href="@{/internacoes(
            page=${i},
            filtroNomeAdolescente=${filtro.filtroNomeAdolescente},
            filtroCidadeAdolescente=${filtro.filtroCidadeAdolescente},
            filtroUnidadeId = ${filtro.filtroUnidadeId},
            filtroStatus=${filtro.filtroStatus},
            size=${filtro.size})}"
                                           th:text="${i + 1}"></a>
                                    </li>
                                </th:block>

                                <!-- Próxima -->
                                <li class="page-item" th:classappend="${internacoes.last} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/internacoes(
                                        page=${internacoes.number + 1},
                                        filtroNomeAdolescente=${filtro.filtroNomeAdolescente},
                                        filtroCidadeAdolescente=${filtro.filtroCidadeAdolescente},
                                        filtroUnidadeId = ${filtro.filtroUnidadeId},
                                        filtroStatus=${filtro.filtroStatus},
                                        size=${filtro.size})}"
                                       data-bs-toggle="tooltip" title="Próxima">
                                        <i class="fa-duotone fa-solid fa-chevron-right"></i>
                                    </a>
                                </li>

                                <!-- Última -->
                                <li class="page-item" th:classappend="${internacoes.last} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{/internacoes(
                                        page=${internacoes.totalPages - 1},
                                        filtroNomeAdolescente=${filtro.filtroNomeAdolescente},
                                        filtroCidadeAdolescente=${filtro.filtroCidadeAdolescente},
                                        filtroUnidadeId = ${filtro.filtroUnidadeId},
                                        filtroStatus=${filtro.filtroStatus},
                                        size=${filtro.size})}"
                                       data-bs-toggle="tooltip" title="Última página">
                                        <i class="fa-duotone fa-solid fa-angles-right"></i>
                                    </a>
                                </li>

                            </ul>
                        </nav>

                    </div>

                </div>
            </div>

        </div>

    </div>

</div>


</body>
</html>
