<!DOCTYPE html>
<html lang="pt-br" layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Atendimentos</title>
</head>

<body>
<div layout:fragment="content">

    <div class="container-fluid p-2">
        <div class="row">
            <div class="col-12">
                <nav aria-label="breadcrumb card"
                     style="margin-top: -25px; font-size: 0.8rem;">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a th:href="@{/home}">
                                <i class="fa-duotone fa-solid fa-house fs-7"></i> Home
                            </a>
                        </li>
                        <li class="breadcrumb-item"><span class="text-muted">
									<i class="fa-duotone fa-solid fa-stethoscope"></i>
									Atendimentos
							</span></li>

                    </ol>
                </nav>
            </div>

            <div class="col-12" th:replace="~{fragments/componentes :: alertas}"></div>

            <div class="col-12">
                    <div class="card">
                        <div th:replace="~{fragments/componentes :: cardHeader(
                                'Atendimentos de Enfermagem',
                                'Gerencie os atendimentos',
                                'user-nurse',
                                '/atendimentos/enfermagem/novo',
                                'Enfermagem',
                                ${isMaster or podeIncluirAtendimentoEnfermagem},
                                ${queryParams}
                            )}"></div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-12">
                                <form class="filter-box mb-2" method="get" th:action="@{/atendimentos/enfermagem}">
                                    <input name="unidadeId" th:value="${unidadeId}" type="hidden">
                                    <div class="row g-3">
                                        <div class="col-md-4">
                                            <label class="form-label small fw-semibold text-secondary">Nome do Adolescente</label>
                                            <div class="input-group input-group-modern">
                                                <span class="input-group-text"><i class="fa-duotone fa-solid fa-user"></i></span>
                                                <input type="text" name="filtroNomeAdolescente" th:value="${filtro.filtroNomeAdolescente}"
                                                       class="form-control" placeholder="Digite para buscar">
                                            </div>
                                        </div>
                                        <div class="col-md-3">
                                            <label class="form-label small fw-semibold text-secondary">Cidade do Adolescente</label>
                                            <div class="input-group input-group-modern">
                                                <span class="input-group-text"><i class="fa-duotone fa-solid fa-location-dot"></i></span>
                                                <input type="text" name="filtroCidadeAdolescente" th:value="${filtro.filtroCidadeAdolescente}"
                                                       class="form-control" placeholder="Digite para buscar">
                                            </div>
                                        </div>

                                        <div class="col-md-1">
                                            <label class="form-label small fw-semibold text-secondary">Linhas</label>
                                            <select name="size" class="form-select form-control-modern">
                                                <option value="10" th:selected="${filtro.size == 10}">10</option>
                                                <option value="15" th:selected="${filtro.size == 15}">15</option>
                                                <option value="20" th:selected="${filtro.size == 20}">20</option>
                                                <option value="25" th:selected="${filtro.size == 25}">25</option>
                                                <option value="30" th:selected="${filtro.size == 30}">30</option>
                                            </select>
                                        </div>

                                        <div class="col-md-2" th:if="${isMaster}">
                                            <label class="form-label small fw-semibold text-secondary">Unidade</label>
                                            <select name="filtroUnidadeId" class="form-select form-control-modern">
                                                <option value="">Todas</option>
                                                <option th:each="u : ${unidades}" th:value="${u.id}"
                                                        th:text="${u.nome}"
                                                        th:selected="${u.id == filtro.filtroUnidadeId}"></option>
                                            </select>
                                        </div>
                                        <div class="col-md-2" th:if="${!isMaster}">
                                            <label class="form-label small fw-semibold text-secondary">Unidade</label>
                                            <input type="text" class="form-control form-control-modern"
                                                   th:value="${lotacaoUsuarioLogado.unidade.nome}" disabled>
                                        </div>
                                        <div th:replace="~{fragments/componentes :: botoesFiltro('/atendimentos/enfermagem', 'col-md-2')}"></div>
                                    </div>


                                </form>


                            </div>
                            <div class="col-12">
                                <div class="d-none d-md-block">
                                    <table class="table table-modern align-middle mb-0">
                                        <thead>
                                        <tr>
                                            <th class="text-center" style="width: 80px;">Foto</th>
                                            <th>Dados</th>
                                            <th>Unidade Cadastro</th>
                                            <th>Unidade Internação</th>
                                            <th>Último Atendimento</th>
                                            <th class="text-center" style="width: 140px;">Atendimentos</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:if="${#lists.isEmpty(lista)}">
                                            <td colspan="6"> <!-- Mudei de 8 para 6, pois sua tabela tem 6 colunas -->
                                                <div th:replace="~{fragments/componentes :: emptyState('Nenhum atendimento encontrado com os filtros atuais.')}"></div>
                                            </td>
                                        </tr>
                                        <tr th:each="atendimento : ${lista}">

                                            <td class="text-center">
                                                <div class="avatar-wrapper">
                                                    <img th:if="${atendimento.fotoRegistro != null}"
                                                         th:src="${atendimento.fotoRegistro}"
                                                         class="avatar-img" alt="Foto">
                                                    <div th:if="${atendimento.fotoRegistro == null}" class="avatar-fallback">
                                                        <i class="fa-duotone fa-solid fa-user"></i>
                                                    </div>

                                                </div>


                                            </td>


                                            <td>
                                                <div class="fw-semibold text-dark" th:text="${atendimento.nome}"></div>

                                                <small  class="text-muted d-block"> Natural:
                                                    <i class="fa-duotone fa-solid fa-location-dot me-1"></i>
                                                    <span th:text="${atendimento.cidadeNascimento}"></span>/<span th:text="${atendimento.ufNascimento}"></span>
                                                    <i class="fa-duotone fa-solid fa-cake-candles me-1"></i>
                                                    <span th:text="${atendimento.idade}"></span> anos
                                                    &bull;

                                                </small>
                                                <small class="text-muted d-block text-truncate" style="max-width: 320px;">
                                                    <i class="fa-duotone fa-solid fa-user-group me-1"></i>
                                                    Mãe: <span th:text="${atendimento.mae}"></span>
                                                 </small>

                                            </td>
                                            <td>
                                                <span class="badge badge-soft-primary"
                                                      th:text="${atendimento.unidadeCadastroNome}">
                                                </span>
                                            </td>
                                            <td>
                                                <span class="badge badge-soft-primary"
                                                      th:text="${atendimento.unidadeNome}">
                                                </span>
                                            </td>

                                            <td th:text="${atendimento.ultimoAtendimento != null ? #temporals.format(atendimento.ultimoAtendimento, 'dd/MM/yyyy') : '-'}"></td>

                                            <td class="text-center text-nowrap">
                                                <div class="d-flex justify-content-center gap-2">

                                                    <!-- Botão 1: Histórico Completo (Azul) -->
                                                    <a class="btn btn-primary btn-sm d-flex align-items-center gap-1"
                                                       th:href="@{/atendimentos/enfermagem/todos/{id}(id=${atendimento.adolescenteId})}"
                                                       data-bs-toggle="tooltip" title="Ver todos os atendimentos">
                                                        <i class="fa-duotone fa-solid fa-clipboard-medical"></i>
                                                        <span th:text="${atendimento.quantidadeAtendimentos}"></span>
                                                    </a>

                                                    <!-- Botão 2: Pendentes -->
                                                    <!-- Botão 2: Pendentes (Vermelho) -->
                                                    <button th:if="${atendimento.quantidadePendentes > 0}"
                                                            type="button"
                                                            class="btn btn-danger btn-sm d-flex align-items-center gap-1"
                                                            th:attr="data-id=${atendimento.adolescenteId}, data-nome=${atendimento.nome}"
                                                            onclick="abrirModalPendentes(this)"
                                                            data-bs-toggle="tooltip" title="Atenção: Existem atendimentos pendentes">
                                                        <i class="fa-duotone fa-solid fa-triangle-exclamation"></i>
                                                        <span th:text="${atendimento.quantidadePendentes}"></span>
                                                    </button>

                                                    <!-- Se NÃO tiver pendência (Cinza e Desabilitado) -->
                                                    <button th:if="${atendimento.quantidadePendentes == 0}"
                                                            type="button"
                                                            class="btn btn-secondary btn-sm d-flex align-items-center gap-1 disabled"
                                                            data-bs-toggle="tooltip" title="Não há atendimentos pendentes"
                                                            style="pointer-events: auto;">
                                                        <i class="fa-duotone fa-solid fa-check"></i>
                                                        <span>0</span>
                                                    </button>

                                                </div>
                                            </td>

                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                                <div class="d-block d-md-none">
                                    <!-- Empty state (fora do each) -->
                                    <div th:if="${#lists.isEmpty(lista)}">
                                        <div th:replace="~{fragments/componentes :: emptyState('Nenhum atendimento encontrado com os filtros atuais.')}"></div>
                                    </div>

                                    <div class="card card-mobile-modern mb-3" th:each="atendimento : ${lista}">

                                        <div class="card-body p-3">

                                            <div class="d-flex gap-3">

                                                <!-- FOTO -->
                                                <!-- FOTO + STATUS DOT -->
                                                <div class="avatar-wrapper avatar-wrapper-lg">
                                                    <img th:if="${atendimento.fotoRegistro != null}"
                                                         th:src="${atendimento.fotoRegistro}"
                                                         class="avatar-img" alt="Foto">
                                                    <div th:if="${atendimento.fotoRegistro == null}" class="avatar-fallback">
                                                        <i class="fa-duotone fa-solid fa-user"></i>
                                                    </div>
                                                </div>

                                                <!-- DADOS -->
                                                <div class="flex-grow-1 min-w-0">

                                                    <!-- NOME -->
                                                    <div class="fw-bold text-dark text-truncate" th:text="${atendimento.nome}"></div>

                                                    <!-- INFO BASICA -->
                                                    <small class="text-muted d-block">
                                                        <i class="fa-duotone fa-solid fa-cake-candles me-1"></i>
                                                        <span th:text="${atendimento.idade}"></span> anos
                                                        &bull;
                                                        <i class="fa-duotone fa-solid fa-location-dot me-1"></i>
                                                        <span th:text="${atendimento.cidadeNascimento}"></span>/<span th:text="${atendimento.ufNascimento}"></span>
                                                    </small>

                                                    <small class="text-muted d-block text-truncate">
                                                        <i class="fa-duotone fa-solid fa-user-group me-1"></i>
                                                        Mãe: <span th:text="${atendimento.mae}"></span>
                                                    </small>

                                                    <small class="text-muted d-block text-truncate">
                                                        Internação: <span class="badge badge-soft-primary"
                                                                          th:text="${atendimento.unidadeNome}"></span>
                                                    </small>
                                                    <small class="text-muted d-block text-truncate">
                                                        Último Atendimento: <span th:text="${atendimento.ultimoAtendimento != null ? #temporals.format(atendimento.ultimoAtendimento, 'dd/MM/yyyy') : '-'}"></span>
                                                    </small>
                                                </div>

                                            </div>

                                            <!-- AÇÕES (Padrão Desktop) -->
                                            <div class="d-flex justify-content-end gap-2 mt-3 pt-3 border-top">

                                                <!-- Botão 1: Histórico Completo (Azul) -->
                                                <a class="btn btn-primary btn-modern btn-sm d-flex align-items-center gap-1"
                                                   th:href="@{/atendimentos/enfermagem/todos/{id}(id=${atendimento.adolescenteId})}"
                                                   data-bs-toggle="tooltip" title="Ver todos os atendimentos">
                                                    <i class="fa-duotone fa-solid fa-clipboard-medical"></i>
                                                    <span th:text="${atendimento.quantidadeAtendimentos}"></span>
                                                </a>

                                                <!-- Botão 2: Pendentes (Vermelho) - Se tiver pendência -->
                                                <button th:if="${atendimento.quantidadePendentes > 0}"
                                                        type="button"
                                                        class="btn btn-danger btn-modern btn-sm d-flex align-items-center gap-1"
                                                        th:attr="data-id=${atendimento.adolescenteId}, data-nome=${atendimento.nome}"
                                                        onclick="abrirModalPendentes(this)"
                                                        data-bs-toggle="tooltip" title="Atenção: Existem atendimentos pendentes">
                                                    <i class="fa-solid fa-triangle-exclamation"></i>
                                                    <span th:text="${atendimento.quantidadePendentes}"></span>
                                                </button>

                                                <!-- Botão 2.1: Sem Pendentes (Cinza) - Se não tiver pendência -->
                                                <button th:if="${atendimento.quantidadePendentes == 0}"
                                                        type="button"
                                                        class="btn btn-secondary btn-modern btn-sm d-flex align-items-center gap-1 disabled"
                                                        style="pointer-events: auto;"
                                                        data-bs-toggle="tooltip" title="Não há atendimentos pendentes">
                                                    <i class="fa-solid fa-check"></i>
                                                    <span>0</span>
                                                </button>

                                            </div>

                                        </div>

                                    </div>

                                </div>


                            </div>
                        </div>

                    </div>
                        <div class="card-footer card-footer-modern d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
                            <!-- Info à esquerda -->
                            <small class="text-muted">
                                Página <strong th:text="${pagina.number + 1}"></strong>
                                de <strong th:text="${pagina.totalPages}"></strong>
                                &bull;
                                <span th:text="${pagina.totalElements}"></span> registro(s)
                            </small>

                            <!-- Paginação à direita -->
                            <nav aria-label="Paginação">
                                <ul class="pagination pagination-modern mb-0">

                                    <!-- Primeira -->
                                    <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                                        <a class="page-link"
                                           th:href="@{'/atendimentos/enfermagem?' + ${@urlUtils.atendimentoEnfermagemQuery(filtro, 0)}}"
                                           data-bs-toggle="tooltip" title="Primeira página">
                                            <i class="fa-duotone fa-solid fa-angles-left"></i>
                                        </a>
                                    </li>

                                    <!-- Anterior -->
                                    <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                                        <a class="page-link"
                                           th:href="@{'/atendimentos/enfermagem?' + ${@urlUtils.atendimentoEnfermagemQuery(filtro, pagina.number - 1)}}"
                                           data-bs-toggle="tooltip" title="Anterior">
                                            <i class="fa-duotone fa-solid fa-chevron-left"></i>
                                        </a>
                                    </li>

                                    <!-- Números -->
                                    <th:block th:if="${pagina.totalPages > 0}">
                                        <li th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}"
                                            class="page-item"
                                            th:classappend="${i == pagina.number} ? 'active'">
                                            <a class="page-link"
                                               th:href="@{'/atendimentos/enfermagem?' + ${@urlUtils.atendimentoEnfermagemQuery(filtro, i)}}"
                                               th:text="${i + 1}"></a>
                                        </li>
                                    </th:block>

                                    <!-- Próxima -->
                                    <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                                        <a class="page-link"
                                           th:href="@{'/atendimentos/enfermagem?' + ${@urlUtils.atendimentoEnfermagemQuery(filtro, pagina.number + 1)}}"
                                           data-bs-toggle="tooltip" title="Próxima">
                                            <i class="fa-duotone fa-solid fa-chevron-right"></i>
                                        </a>
                                    </li>

                                    <!-- Última -->
                                    <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                                        <a class="page-link"
                                           th:href="@{'/atendimentos/enfermagem?' + ${@urlUtils.atendimentoEnfermagemQuery(filtro, pagina.totalPages - 1)}}"
                                           data-bs-toggle="tooltip" title="Última página">
                                            <i class="fa-duotone fa-solid fa-angles-right"></i>
                                        </a>
                                    </li>

                                </ul>
                            </nav>
                    </div>

                </div>
            </div>

        </div>

    </div>
    <!-- Modal de Atendimentos -->

    <!-- Modal de Pendências -->
    <div class="modal fade" id="modalPendentes" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">
                        <i class="fa-solid fa-triangle-exclamation"></i> Pendências de <span id="modalNomeAdolescente"></span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="listaPendentesModal">
                        <p class="text-center text-muted">Carregando...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function abrirModalPendentes(botao) {
            // 🔥 Pega os dados de forma segura direto do HTML
            const adolescenteId = botao.getAttribute('data-id');
            const nomeAdolescente = botao.getAttribute('data-nome');

            document.getElementById('modalNomeAdolescente').textContent = nomeAdolescente;
            const modal = new bootstrap.Modal(document.getElementById('modalPendentes'));
            modal.show();

            const container = document.getElementById('listaPendentesModal');
            container.innerHTML = '<p class="text-center text-muted">Carregando...</p>';

            try {
                const response = await fetch('/atendimentos/enfermagem/pendentes/' + adolescenteId);
                const atendimentos = await response.json();

                if (atendimentos.length === 0) {
                    container.innerHTML = '<p class="text-center text-success">Nenhuma pendência encontrada.</p>';
                    return;
                }

                let html = '<ul class="list-group">';
                atendimentos.forEach(a => {
                    html += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <strong>Data:</strong> ${a.data} às ${a.hora} <br>
                        <span class="badge bg-warning text-dark">${a.encerramento}</span>
                    </div>
                    <a href="/atendimentos/conduta/${a.id}" class="btn btn-danger btn-sm">
                        <i class="fa-solid fa-check"></i> Finalizar
                    </a>
                </li>
                `;
                });
                html += '</ul>';
                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = '<p class="text-center text-danger">Erro ao carregar pendências.</p>';
            }
        }
    </script>
</div>


</body>
</html>
