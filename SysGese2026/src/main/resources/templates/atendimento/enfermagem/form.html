<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/base}">

<head>
<title>Atendimento Enfermagem</title>
<!-- Este será substituído -->

</head>

<body>
	<div layout:fragment="content">

		<div class="container-fluid p-2">
			<div class="row">
				<div class="col-12">
					<nav aria-label="breadcrumb card"
						style="margin-top: -25px; font-size: 0.8rem;">
						<ol class="breadcrumb">
							<li class="breadcrumb-item"><a th:href="@{/home}"> <i
									class="fa-duotone fa-solid fa-house fs-7"></i> Home
							</a></li>
							<li class="breadcrumb-item"><a
								th:href="@{${queryParams != null and queryParams != ''} ? 
              '/atendimentos/enfermagem?' + queryParams :
              '/atendimentos/enfermagem'}">
								<i class="fa-duotone fa-solid fa-user-nurse"></i> Atendimentos

							</a></li>
							<li class="breadcrumb-item"><span class="text-muted"><i class="fa-duotone fa-solid fa-stethoscope"></i> Novo Registro </span></li>


						</ol>
					</nav>
				</div>
				<div class="col-12">
					<!-- Mensagens de erro e de ok -->
					<div th:if="${msgOk}"
						class="alert alert-success alert-dismissible fade show"
						role="alert" id="successAlert">
						<i class="fa-duotone fa-solid fa-thumbs-up me-2"></i> <span
							th:text="${msgOk}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"
							aria-label="Close"></button>
					</div>

					<!-- Mensagem de Erro -->
					<div th:if="${msgErro}"
						class="alert alert-danger alert-dismissible fade show"
						role="alert" id="errorAlert">
						<i class="fa-duotone fa-solid fa-triangle-exclamation me-2"></i> <span
							th:text="${msgErro}"></span>
						<button type="button" class="btn-close" data-bs-dismiss="alert"
							aria-label="Close"></button>
					</div>
				</div>
				<div class="col-12">

					<form th:action="@{/atendimentos/enfermagem/salvar}"
						th:object="${atendimento}" method="post">

						<div class="card">

							<div
								class="card-header d-flex justify-content-between align-items-center fs-4 pr-custom-text fw-semibold text-uppercase">

								<h5 class="mb-0 text-secondary">Novo Registro</h5>

								<div class="d-flex gap-2">
									<a
										th:href="@{${queryParams != null and queryParams != ''} ? 
              '/atendimentos/enfermagem?' + queryParams :
              '/atendimentos/enfermagem'}"
										class="btn btn-outline-danger"> <i
										class="fa-duotone fa-solid fa-ban"></i> Cancelar
									</a>

									<button type="submit" class="btn btn-outline-sistema">
										<i class="fa-duotone fa-solid fa-floppy-disk"></i> SALVAR
									</button>
								</div>

							</div>


							<div class="card-body">
								<div class="row">
									<div class="col-12">




									</div>

								</div>
								<!-- fim da col dentro do bdy -->


							</div>





						</div>
                        
                        <div th:replace="~{fragments/footerForm :: footerForm}"></div>
					</form>
				</div>
				<!-- fim do card -->




			</div>

		</div>
		<!-- FIM DO CARD -->





	</div>
</body>
</html>
