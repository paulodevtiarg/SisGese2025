<!DOCTYPE html>
<html lang="pt-br" layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Histórico de Atendimentos</title>
</head>

<body>
<div layout:fragment="content">

    <div class="container-fluid p-2">
        <div class="row">
            <div class="col-12">
                <nav aria-label="breadcrumb card"
                     style="margin-top: -25px; font-size: 0.8rem;">
                    <ol class="breadcrumb">
                        <li class="breadcrumb-item">
                            <a th:href="@{/home}">
                                <i class="fa-duotone fa-solid fa-house fs-7"></i> Home
                            </a>
                        </li>
                        <li class="breadcrumb-item">
                            <a th:href="@{/enfermagem/atendimentos}">
									<i class="fa-duotone fa-solid fa-stethoscope"></i>
									Atendimentos
							</a>
                        </li>
                        <li class="breadcrumb-item">
                            <span class="text-muted">
                               <i class="fa-duotone fa-solid fa-clock-rotate-left"></i>
                                Histórico
                            </span>
                        </li>

                    </ol>
                </nav>
            </div>

            <div class="col-12" th:replace="~{fragments/componentes :: alertas}"></div>

            <div class="col-12">

                <div class="card">
                    <!-- HEADER PERSONALIZADO -->
                    <div class="card-header card-header-modern d-flex justify-content-between align-items-center">
                        <div class="d-flex align-items-center gap-3">
                            <!-- Foto do Adolescente -->
                            <div class="avatar-wrapper" style="width: 50px; height: 50px;">
                                <img th:if="${adolescente.fotoRegistro != null}"
                                     th:src="${adolescente.fotoRegistro}"
                                     class="rounded-circle w-100 h-100 object-fit-cover" alt="Foto">
                                <div th:if="${adolescente.fotoRegistro == null}"
                                     class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center w-100 h-100">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                            </div>
                            <!-- Nome e Subtítulo -->
                            <div>
                                <h5 class="mb-0 fw-semibold" th:text="${adolescente.nome}">Nome do Adolescente</h5>
                                <small class="text-muted">Histórico de Atendimentos de Enfermagem</small>
                            </div>
                        </div>

                        <!-- Botões de Ação -->
                        <div class="d-flex gap-2">
                            <a th:href="@{/atendimentos/enfermagem}" class="btn btn-light btn-modern d-flex align-items-center btn-sm gap-2">
                                <i class="fa-duotone fa-solid fa-arrow-left"></i>
                                <span class="d-none d-sm-inline">Voltar</span>
                            </a>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row">

                            <div class="col-12">

                                <!-- ==================== VERSÃO DESKTOP (Tabela) ==================== -->
                                <div class="d-none d-md-block">
                                    <table class="table table-modern align-middle mb-0">
                                        <thead>
                                        <tr>
                                            <th>Data Atendimento</th>
                                            <th>Motivo Atendimento</th>
                                            <th>Conduta</th>
                                            <th>Encerramento</th>
                                            <th class="text-center" style="width: 140px;">Ações</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:if="${#lists.isEmpty(listaAtendimentos)}">
                                            <td colspan="5">
                                                <div th:replace="~{fragments/componentes :: emptyState('Nenhum atendimento encontrado com os filtros atuais.')}"></div>
                                            </td>
                                        </tr>
                                        <tr th:each="atendimento : ${listaAtendimentos}">

                                            <td>
                                                <div class="fw-semibold text-dark"
                                                     th:text="${atendimento.data != null ? #temporals.format(atendimento.data, 'dd ''de'' MMMM ''de'' yyyy') : '-'}">
                                                </div>
                                            </td>

                                            <!-- MOTIVO -->
                                            <td>
                    <span class="badge"
                          th:classappend="${atendimento.motivoAtendimento?.name() == 'MAL_ESTAR' or atendimento.motivoAtendimento?.name() == 'FEBRE' or atendimento.motivoAtendimento?.name() == 'QUEIXA_RESPIRATORIA'} ? 'bg-danger' :
                                          (${atendimento.motivoAtendimento?.name() == 'DOR' or atendimento.motivoAtendimento?.name() == 'CEFALEIA' or atendimento.motivoAtendimento?.name() == 'NAUSEA_VOMITO' or atendimento.motivoAtendimento?.name() == 'DIARREIA'} ? 'bg-warning text-dark' :
                                          (${atendimento.motivoAtendimento?.name() == 'ADMINISTRACAO_MEDICAMENTO' or atendimento.motivoAtendimento?.name() == 'LESAO_FERIMENTO'} ? 'bg-primary' :
                                          (${atendimento.motivoAtendimento?.name() == 'ALTERACAO_EMOCIONAL_COMPORTAMENTAL' or atendimento.motivoAtendimento?.name() == 'AVALIACAO_ROTINA'} ? 'bg-info text-dark' : 'bg-secondary')))"
                          th:text="${atendimento.motivoAtendimento?.descricao ?: '-'}">
                    </span>
                                            </td>

                                            <!-- CONDUTA -->
                                            <td>
                    <span class="badge"
                          th:classappend="${atendimento.conduta?.name() == 'ADMINISTRACAO_MEDICAMENTO' or atendimento.conduta?.name() == 'CURATIVO' or atendimento.conduta?.name() == 'HIGIENIZACAO_FERIMENTO'} ? 'bg-primary' :
                                          (${atendimento.conduta?.name() == 'ORIENTACAO' or atendimento.conduta?.name() == 'REPOUSO' or atendimento.conduta?.name() == 'HIDRATACAO'} ? 'bg-info text-dark' :
                                          (${atendimento.conduta?.name() == 'ENCAMINHAMENTO' or atendimento.conduta?.name() == 'OBSERVACAO' or atendimento.conduta?.name() == 'COMUNICACAO_EQUIPE_MEDICA'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                          th:text="${atendimento.conduta?.descricao ?: '-'}">
                    </span>
                                            </td>

                                            <!-- ENCERRAMENTO -->
                                            <td>
                    <span class="badge"
                          th:classappend="${atendimento.encerramento?.name() == 'RESOLVIDO'} ? 'bg-success' :
                                          (${atendimento.encerramento?.name() == 'ENCAMINHADO'} ? 'bg-primary' :
                                          (${atendimento.encerramento?.name() == 'EM_OBSERVACAO' or atendimento.encerramento?.name() == 'NECESSITA_ACOMPANHAMENTO'} ? 'bg-warning text-dark' :
                                          (${atendimento.encerramento?.name() == 'NECESSITA_REAVALIACAO'} ? 'bg-danger' : 'bg-secondary')))"
                          th:text="${atendimento.encerramento?.descricao ?: '-'}">
                    </span>
                                            </td>

                                            <!-- AÇÕES -->
                                            <td class="text-center text-nowrap">
                                                <div th:replace="~{fragments/componentes :: acoesHistorico(
                        ${atendimento.id},
                        ${atendimento.encerramento},
                        '/atendimentos/enfermagem/detalhes/' + ${atendimento.id},
                        '/atendimentos/conduta/' + ${atendimento.id}
                    )}"></div>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>

                                <!-- ==================== VERSÃO MOBILE (Cards) ==================== -->
                                <div class="d-block d-md-none">

                                    <!-- Empty state mobile -->
                                    <div th:if="${#lists.isEmpty(listaAtendimentos)}">
                                        <div th:replace="~{fragments/componentes :: emptyState('Nenhum atendimento encontrado com os filtros atuais.')}"></div>
                                    </div>

                                    <!-- Card por Atendimento -->
                                    <div class="card card-mobile-modern mb-3" th:each="atendimento : ${listaAtendimentos}">
                                        <div class="card-body p-3">

                                            <!-- Topo: Data e Hora -->
                                            <div class="d-flex justify-content-between align-items-center mb-2 border-bottom pb-2">
                                                <div class="fw-bold text-dark">
                                                    <i class="fa-duotone fa-solid fa-calendar-days me-1 text-muted"></i>
                                                    <span th:text="${atendimento.data != null ? #temporals.format(atendimento.data, 'dd/MM/yyyy') : '-'}"></span>
                                                </div>
                                            </div>

                                            <!-- Corpo: Motivo, Conduta e Encerramento -->
                                            <div class="mb-3">
                                                <!-- Motivo -->
                                                <div class="mb-2">
                                                    <small class="text-muted d-block mb-1">Motivo:</small>
                                                    <span class="badge"
                                                          th:classappend="${atendimento.motivoAtendimento?.name() == 'MAL_ESTAR' or atendimento.motivoAtendimento?.name() == 'FEBRE' or atendimento.motivoAtendimento?.name() == 'QUEIXA_RESPIRATORIA'} ? 'bg-danger' :
                                              (${atendimento.motivoAtendimento?.name() == 'DOR' or atendimento.motivoAtendimento?.name() == 'CEFALEIA' or atendimento.motivoAtendimento?.name() == 'NAUSEA_VOMITO' or atendimento.motivoAtendimento?.name() == 'DIARREIA'} ? 'bg-warning text-dark' :
                                              (${atendimento.motivoAtendimento?.name() == 'ADMINISTRACAO_MEDICAMENTO' or atendimento.motivoAtendimento?.name() == 'LESAO_FERIMENTO'} ? 'bg-primary' :
                                              (${atendimento.motivoAtendimento?.name() == 'ALTERACAO_EMOCIONAL_COMPORTAMENTAL' or atendimento.motivoAtendimento?.name() == 'AVALIACAO_ROTINA'} ? 'bg-info text-dark' : 'bg-secondary')))"
                                                          th:text="${atendimento.motivoAtendimento?.descricao ?: '-'}">
                        </span>
                                                </div>

                                                <!-- Conduta -->
                                                <div class="mb-2">
                                                    <small class="text-muted d-block mb-1">Conduta:</small>
                                                    <span class="badge"
                                                          th:classappend="${atendimento.conduta?.name() == 'ADMINISTRACAO_MEDICAMENTO' or atendimento.conduta?.name() == 'CURATIVO' or atendimento.conduta?.name() == 'HIGIENIZACAO_FERIMENTO'} ? 'bg-primary' :
                                              (${atendimento.conduta?.name() == 'ORIENTACAO' or atendimento.conduta?.name() == 'REPOUSO' or atendimento.conduta?.name() == 'HIDRATACAO'} ? 'bg-info text-dark' :
                                              (${atendimento.conduta?.name() == 'ENCAMINHAMENTO' or atendimento.conduta?.name() == 'OBSERVACAO' or atendimento.conduta?.name() == 'COMUNICACAO_EQUIPE_MEDICA'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                                          th:text="${atendimento.conduta?.descricao ?: '-'}">
                        </span>
                                                </div>

                                                <!-- Encerramento -->
                                                <div>
                                                    <small class="text-muted d-block mb-1">Encerramento:</small>
                                                    <span class="badge"
                                                          th:classappend="${atendimento.encerramento?.name() == 'RESOLVIDO'} ? 'bg-success' :
                                              (${atendimento.encerramento?.name() == 'ENCAMINHADO'} ? 'bg-primary' :
                                              (${atendimento.encerramento?.name() == 'EM_OBSERVACAO' or atendimento.encerramento?.name() == 'NECESSITA_ACOMPANHAMENTO'} ? 'bg-warning text-dark' :
                                              (${atendimento.encerramento?.name() == 'NECESSITA_REAVALIACAO'} ? 'bg-danger' : 'bg-secondary')))"
                                                          th:text="${atendimento.encerramento?.descricao ?: '-'}">
                        </span>
                                                </div>
                                            </div>

                                            <!-- Ações -->
                                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                                <div th:replace="~{fragments/componentes :: acoesHistorico(
                        ${atendimento.id},
                        ${atendimento.encerramento},
                        '/atendimentos/enfermagem/detalhes/' + ${atendimento.id},
                        '/atendimentos/conduta/' + ${atendimento.id}
                    )}"></div>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="card-footer card-footer-modern d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
                        <!-- Info à esquerda -->
                        <small class="text-muted">
                            Página <strong th:text="${pagina.number + 1}"></strong>
                            de <strong th:text="${pagina.totalPages}"></strong>
                            &bull;
                            <span th:text="${pagina.totalElements}"></span> registro(s)
                        </small>

                        <!-- Paginação à direita -->
                        <nav aria-label="Paginação">
                            <ul class="pagination pagination-modern mb-0">
                                <!-- Primeira -->
                                <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{'/atendimentos/enfermagem/todos/' + ${adolescente.id} + '?page=0'}"
                                       title="Primeira página">
                                        <i class="fa-duotone fa-solid fa-angles-left"></i>
                                    </a>
                                </li>

                                <!-- Anterior -->
                                <li class="page-item" th:classappend="${pagina.first} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{'/atendimentos/enfermagem/todos/' + ${adolescente.id} + '?page=' + ${pagina.number - 1}}"
                                       title="Anterior">
                                        <i class="fa-duotone fa-solid fa-chevron-left"></i>
                                    </a>
                                </li>

                                <!-- Números -->
                                <th:block th:if="${pagina.totalPages > 0}">
                                    <li th:each="i : ${#numbers.sequence(0, pagina.totalPages - 1)}"
                                        class="page-item"
                                        th:classappend="${i == pagina.number} ? 'active'">
                                        <a class="page-link"
                                           th:href="@{'/atendimentos/enfermagem/todos/' + ${adolescente.id} + '?page=' + ${i}}"
                                           th:text="${i + 1}"></a>
                                    </li>
                                </th:block>

                                <!-- Próxima -->
                                <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{'/atendimentos/enfermagem/todos/' + ${adolescente.id} + '?page=' + ${pagina.number + 1}}"
                                       title="Próxima">
                                        <i class="fa-duotone fa-solid fa-chevron-right"></i>
                                    </a>
                                </li>

                                <!-- Última -->
                                <li class="page-item" th:classappend="${pagina.last} ? 'disabled'">
                                    <a class="page-link"
                                       th:href="@{'/atendimentos/enfermagem/todos/' + ${adolescente.id} + '?page=' + (${pagina.totalPages} - 1)}"
                                       title="Última página">
                                        <i class="fa-duotone fa-solid fa-angles-right"></i>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>

                </div>
            </div>

        </div>

    </div>
    <!-- Modal de Atendimentos -->
    <div class="modal fade" id="modalAtendimentos" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Atendimentos de <span id="modalNomeAdolescente"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Onde a lista vai aparecer via JS -->
                    <div id="listaAtendimentosModal">
                        <p class="text-center text-muted">Carregando...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        async function abrirModalAtendimentos(adolescenteId, nomeAdolescente) {
            // Preenche o nome no título
            document.getElementById('modalNomeAdolescente').textContent = nomeAdolescente;

            // Abre o modal
            const modal = new bootstrap.Modal(document.getElementById('modalAtendimentos'));
            modal.show();

            // Mostra mensagem de carregando
            const container = document.getElementById('listaAtendimentosModal');
            container.innerHTML = '<p class="text-center text-muted">Carregando...</p>';

            try {
                const response = await fetch('/atendimentos/enfermagem/pendentes/' + adolescenteId);
                const atendimentos = await response.json();

                if (atendimentos.length === 0) {
                    container.innerHTML = '<p class="text-center text-success">Nenhuma pendência encontrada para este adolescente.</p>';
                    return;
                }

                let html = '<ul class="list-group">';
                atendimentos.forEach(a => {
                    html += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>Data:</strong> ${a.data} às ${a.hora} <br>
                            <span class="badge bg-warning text-dark">${a.encerramento}</span>
                        </div>
                        <a href="/atendimentos/conduta/${a.id}" class="btn btn-danger btn-sm">
                            <i class="fa-solid fa-triangle-exclamation"></i> Finalizar
                        </a>
                    </li>
                `;
                });
                html += '</ul>';
                container.innerHTML = html;

            } catch (error) {
                container.innerHTML = '<p class="text-center text-danger">Erro ao carregar atendimentos.</p>';
            }
        }
    </script>
</div>


</body>
</html>
