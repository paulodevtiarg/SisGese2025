<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/base}">

<head>
<title>Adolescentes</title>

</head>

<body>
	<div layout:fragment="content">

		<div class="container-fluid p-2">
			<div class="row">
				<div class="col-12">
					<nav aria-label="breadcrumb card"
						style="margin-top: -25px; font-size: 0.8rem;">
						<ol class="breadcrumb">
							<li class="breadcrumb-item"><a th:href="@{/home}"> <i
									class="fa-duotone fa-solid fa-house fs-7"></i> Home
							</a></li>
							<li class="breadcrumb-item"><span class="text-muted">
									<i class="fa-duotone fa-solid fa-child"></i> Adolescente
							</span></li>

						</ol>
					</nav>


				</div>
				<div class="col-12" th:replace="~{fragments/componentes :: alertas}"></div>

				<div class="col-12">
					<div class="card">
						<div th:replace="~{fragments/componentes :: cardHeader(
						'Adolescentes',
						'Gerencie os registros de adolescentes',
						'child',
						'/adolescentes/novo',
						'Adolescente',
						${isMaster},
						${queryParams}
					)}">

						</div>
						<div class="card-body">
							<div class="row">
								<div class="col-12">
									<form th:action="@{/adolescentes}" method="get" class="filter-box mb-2">
										<input type="hidden" name="unidadeId" th:value="${unidadeId}">

										<div class="row g-3">
											<div class="col-md-4">
												<label class="form-label small fw-semibold text-secondary">Nome do Adolescente</label>
												<div class="input-group input-group-modern">
													<span class="input-group-text"><i class="fa-duotone fa-solid fa-user"></i></span>
													<input type="text" name="filtroNome" th:value="${filtro.filtroNome}"
													       class="form-control" placeholder="Digite para buscar">
												</div>
											</div>

											<div class="col-md-3">
												<label class="form-label small fw-semibold text-secondary">Apelido</label>
												<div class="input-group input-group-modern">
													<span class="input-group-text"><i class="fa-duotone fa-solid fa-tag"></i></span>
													<input type="text" name="filtroApelido" th:value="${filtro.filtroApelido}"
													       class="form-control" placeholder="Digite para buscar">
												</div>
											</div>

											<div class="col-md-3">
												<label class="form-label small fw-semibold text-secondary">Cidade</label>
												<div class="input-group input-group-modern">
													<span class="input-group-text"><i class="fa-duotone fa-solid fa-location-dot"></i></span>
													<input type="text" name="filtroCidade" th:value="${filtro.filtroCidade}"
													       class="form-control" placeholder="Digite para buscar">
												</div>
											</div>

											<div class="col-md-2">
												<label class="form-label small fw-semibold text-secondary">CPF</label>
												<div class="input-group input-group-modern">
													<span class="input-group-text"><i class="fa-duotone fa-solid fa-id-card"></i></span>
													<input type="text" name="filtroCpf" th:value="${filtro.filtroCpf}"
													       class="form-control" placeholder="000.000.000-00" oninput="mascaraCPF(this)">
												</div>
											</div>

											<div class="col-md-1">
												<label class="form-label small fw-semibold text-secondary">Idade Mínima</label>
												<input type="number" name="idadeMin" th:value="${filtro.idadeMin}"
												       class="form-control form-control-modern" placeholder="0">
											</div>

											<div class="col-md-1">
												<label class="form-label small fw-semibold text-secondary">Idade Máxima</label>
												<input type="number" name="idadeMax" th:value="${filtro.idadeMax}"
												       class="form-control form-control-modern" placeholder="99">
											</div>

											<div class="col-md-2">
												<label class="form-label small fw-semibold text-secondary">Status</label>
												<select name="filtroStatus" class="form-select form-control-modern">
													<option value="ATIVO"   th:selected="${filtro.filtroStatus == 'ATIVO'}">Ativos</option>
													<option value="INATIVO" th:selected="${filtro.filtroStatus == 'INATIVO'}">Inativos</option>
													<option value="TODOS"   th:selected="${filtro.filtroStatus == 'TODOS'}">Todos</option>
												</select>
											</div>

											<div class="col-md-2">
												<label class="form-label small fw-semibold text-secondary">Linhas</label>
												<select name="size" class="form-select form-control-modern">
													<option value="10" th:selected="${filtro.size == 10}">10</option>
													<option value="15" th:selected="${filtro.size == 15}">15</option>
													<option value="20" th:selected="${filtro.size == 20}">20</option>
													<option value="25" th:selected="${filtro.size == 25}">25</option>
													<option value="30" th:selected="${filtro.size == 30}">30</option>
												</select>
											</div>

											<div class="col-md-2" th:if="${isMaster}">
												<label class="form-label small fw-semibold text-secondary">Unidade</label>
												<select name="filtroUnidadeId" class="form-select form-control-modern">
													<option value="">Todas</option>
													<option th:each="u : ${unidades}" th:value="${u.id}"
													        th:text="${u.nome}"
													        th:selected="${u.id == filtro.filtroUnidadeId}"></option>
												</select>
											</div>

											<div class="col-md-2" th:if="${!isMaster}">
												<label class="form-label small fw-semibold text-secondary">Unidade</label>
												<input type="text" class="form-control form-control-modern"
												       th:value="${lotacaoUsuarioLogado.unidade.nome}" disabled>
											</div>

											<div th:replace="~{fragments/componentes :: botoesFiltro('/adolescentes', 'col-md-4')}"></div>
										</div>
									</form>

								</div>
								<div class="col-12">
									<div class="d-none d-md-block">
										<table class="table table-modern align-middle mb-0">
											<thead>
											<tr>
												<th class="text-center" style="width: 80px;">Foto</th>
												<th>Dados</th>
												<th>Cidade <small>(residência)</small></th>
												<th>Bairro <small>(residência)</small></th>
												<th>UF <small>(residência)</small></th>
												<th>Unidade Cadastro</th>
												<th class="text-center" style="width: 120px;">Status</th>
												<th class="text-center" style="width: 140px;">Ações</th>
											</tr>
											</thead>
											<tbody>
											<tr th:if="${adolescentes.empty}">
												<td colspan="8">
													<div th:replace="~{fragments/componentes :: emptyState('Nenhum adolescente encontrado com os filtros atuais.')}"></div>
												</td>
											</tr>

											<tr th:each="adolescente : ${adolescentes}">
												<td class="text-center">
													<div class="avatar-wrapper">
														<img th:if="${adolescente.fotoRegistro != null}"
														     th:src="${adolescente.fotoRegistro}"
														     class="avatar-img" alt="Foto">
														<div th:if="${adolescente.fotoRegistro == null}" class="avatar-fallback">
															<i class="fa-duotone fa-solid fa-user"></i>
														</div>
														<span class="status-dot"
														      th:classappend="${adolescente.status} ? 'bg-success' : 'bg-secondary'"
														      th:title="${adolescente.status} ? 'Ativo' : 'Inativo'"></span>
													</div>
												</td>

												<td>
													<div class="fw-semibold text-dark" th:text="${adolescente.nome}"></div>

													<small class="text-muted d-block">
														<i class="fa-duotone fa-solid fa-cake-candles me-1"></i>
														<span th:text="${adolescente.idade}"></span> anos
														&bull;
														<i class="fa-duotone fa-solid fa-location-dot me-1"></i>
														<span th:text="${adolescente.cidadeNascimento}"></span>/<span th:text="${adolescente.ufNascimento}"></span>
													</small>

													<small class="text-muted d-block text-truncate" style="max-width: 320px;">
														<i class="fa-duotone fa-solid fa-user-group me-1"></i>
														Mãe: <span th:text="${adolescente.mae}"></span>
													</small>

													<div class="mt-1 d-flex flex-wrap gap-1">
                    <span th:if="${adolescente.possuiInternacaoAtiva}" class="badge badge-soft-danger">
                        <i class="fa-duotone fa-solid fa-lock me-1"></i> Internado
                        <span th:if="${adolescente.nomeUnidadeInternacao != null}">
                            &bull; <span th:text="${adolescente.nomeUnidadeInternacao}"></span>
                        </span>
                    </span>
														<span th:if="${!adolescente.possuiInternacaoAtiva}" class="badge badge-soft-success">
                        <i class="fa-duotone fa-solid fa-unlock me-1"></i> Livre
                    </span>
													</div>
												</td>

												<td th:text="${adolescente.enderecoAtual?.cidade}"></td>
												<td th:text="${adolescente.enderecoAtual?.bairro}"></td>
												<td>
                <span class="badge badge-soft-secondary"
                      th:text="${adolescente.enderecoAtual?.uf}"></span>
												</td>

												<td>
                <span class="badge badge-soft-primary"
                      th:text="${adolescente.nomeUnidadeCadastro}"></span>
												</td>

												<td class="text-center">
													<th:block th:replace="~{fragments/componentes :: badgeStatus(${adolescente.status})}"></th:block>
												</td>

												<td class="text-center text-nowrap">
													<div th:replace="~{fragments/componentes :: acoes(
													${adolescente.id},
													'/adolescentes',
													${queryParams},
													${isMaster},
													'adolescente'
												     )}">

													</div>
												</td>
											</tr>
											</tbody>
										</table>
									</div>
									<div class="d-block d-md-none">

										<!-- Empty state -->
										<div th:if="${adolescentes.empty}"
										     th:replace="~{fragments/componentes :: emptyState('Nenhum adolescente encontrado com os filtros atuais.')}">

										</div>

										<div class="card card-mobile-modern mb-3" th:each="adolescente : ${adolescentes}">
											<div class="card-body p-3">

												<div class="d-flex gap-3">

													<!-- FOTO + STATUS DOT -->
													<div class="avatar-wrapper avatar-wrapper-lg">
														<img th:if="${adolescente.fotoRegistro != null}"
														     th:src="${adolescente.fotoRegistro}"
														     class="avatar-img" alt="Foto">
														<div th:if="${adolescente.fotoRegistro == null}" class="avatar-fallback">
															<i class="fa-duotone fa-solid fa-user"></i>
														</div>
														<span class="status-dot"
														      th:classappend="${adolescente.status} ? 'bg-success' : 'bg-secondary'"
														      th:title="${adolescente.status} ? 'Ativo' : 'Inativo'"></span>
													</div>

													<!-- DADOS -->
													<div class="flex-grow-1 min-w-0">

														<div class="fw-bold text-dark text-truncate" th:text="${adolescente.nome}"></div>

														<small class="text-muted d-block">
															<i class="fa-duotone fa-solid fa-cake-candles me-1"></i>
															<span th:text="${adolescente.idade}"></span> anos
															&bull;
															<i class="fa-duotone fa-solid fa-location-dot me-1"></i>
															<span th:text="${adolescente.cidadeNascimento}"></span>/<span th:text="${adolescente.ufNascimento}"></span>
														</small>

														<small class="text-muted d-block text-truncate">
															<i class="fa-duotone fa-solid fa-user-group me-1"></i>
															Mãe: <span th:text="${adolescente.mae}"></span>
														</small>

														<small class="text-muted d-block text-truncate">
															<i class="fa-duotone fa-solid fa-house me-1"></i>
															<span th:text="${adolescente.enderecoAtual?.cidade}"></span> - <span th:text="${adolescente.enderecoAtual?.uf}"></span>
														</small>

													</div>

												</div>

												<!-- BADGES -->
												<div class="d-flex flex-wrap gap-1 mt-2">
													<th:block th:replace="~{fragments/componentes :: badgeStatus(${adolescente.status})}"></th:block>

													<span th:if="${adolescente.possuiInternacaoAtiva}" class="badge badge-soft-danger">
                    <i class="fa-duotone fa-solid fa-lock me-1"></i> Internado
                    <span th:if="${adolescente.nomeUnidadeInternacao != null}">
                        &bull; <span th:text="${adolescente.nomeUnidadeInternacao}"></span>
                    </span>
                </span>
													<span th:if="${!adolescente.possuiInternacaoAtiva}" class="badge badge-soft-success">
                    <i class="fa-duotone fa-solid fa-unlock me-1"></i> Livre
                </span>
												</div>

												<!-- AÇÕES -->
												<div class="d-flex justify-content-end gap-2 mt-3 pt-3 border-top">
													<div th:replace="~{fragments/componentes :: acoes(
        ${adolescente.id},
        '/adolescentes',
        ${queryParams},
        ${isMaster},
        'adolescente'
    )}"></div>
												</div>

											</div>
										</div>

									</div>
								</div>
							</div>

						</div>
						<div class="card-footer card-footer-modern d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">

							<!-- Info à esquerda -->
							<small class="text-muted">
								Página <strong th:text="${adolescentes.number + 1}"></strong>
								de <strong th:text="${adolescentes.totalPages}"></strong>
								&bull;
								<span th:text="${adolescentes.totalElements}"></span> registro(s)
							</small>



							<!-- Paginação à direita -->
							<nav aria-label="Paginação">
								<ul class="pagination pagination-modern mb-0">

									<!-- Primeira -->
									<li class="page-item" th:classappend="${adolescentes.first} ? 'disabled'">
										<a class="page-link"
										   th:href="@{/adolescentes(
                        page=0,
                        filtroNome=${filtro.filtroNome},
                        filtroApelido=${filtro.filtroApelido},
                        filtroCidade=${filtro.filtroCidade},
                        filtroCpf=${filtro.filtroCpf},
                        idadeMin=${filtro.idadeMin},
                        idadeMax=${filtro.idadeMax},
                        filtroStatus=${filtro.filtroStatus},
                        size=${filtro.size})}"
										   data-bs-toggle="tooltip" title="Primeira página">
											<i class="fa-duotone fa-solid fa-angles-left"></i>
										</a>
									</li>

									<!-- Anterior -->
									<li class="page-item" th:classappend="${adolescentes.first} ? 'disabled'">
										<a class="page-link"
										   th:href="@{/adolescentes(
                        page=${adolescentes.number - 1},
                        filtroNome=${filtro.filtroNome},
                        filtroApelido=${filtro.filtroApelido},
                        filtroCidade=${filtro.filtroCidade},
                        filtroCpf=${filtro.filtroCpf},
                        idadeMin=${filtro.idadeMin},
                        idadeMax=${filtro.idadeMax},
                        filtroStatus=${filtro.filtroStatus},
                        size=${filtro.size})}"
										   data-bs-toggle="tooltip" title="Anterior">
											<i class="fa-duotone fa-solid fa-chevron-left"></i>
										</a>
									</li>
									<th:block th:if="${adolescentes.totalPages > 0}">
									<!-- Números -->
									<li th:each="i : ${#numbers.sequence(0, adolescentes.totalPages - 1)}"
									    class="page-item"
									    th:classappend="${i == adolescentes.number} ? 'active'">
										<a class="page-link"
										   th:href="@{/adolescentes(
                        page=${i},
                        filtroNome=${filtro.filtroNome},
                        filtroApelido=${filtro.filtroApelido},
                        filtroCidade=${filtro.filtroCidade},
                        filtroCpf=${filtro.filtroCpf},
                        idadeMin=${filtro.idadeMin},
                        idadeMax=${filtro.idadeMax},
                        filtroStatus=${filtro.filtroStatus},
                        size=${filtro.size})}"
										   th:text="${i + 1}"></a>
									</li>
									</th:block>
									<!-- Próxima -->
									<li class="page-item" th:classappend="${adolescentes.last} ? 'disabled'">
										<a class="page-link"
										   th:href="@{/adolescentes(
                        page=${adolescentes.number + 1},
                        filtroNome=${filtro.filtroNome},
                        filtroApelido=${filtro.filtroApelido},
                        filtroCidade=${filtro.filtroCidade},
                        filtroCpf=${filtro.filtroCpf},
                        idadeMin=${filtro.idadeMin},
                        idadeMax=${filtro.idadeMax},
                        filtroStatus=${filtro.filtroStatus},
                        size=${filtro.size})}"
										   data-bs-toggle="tooltip" title="Próxima">
											<i class="fa-duotone fa-solid fa-chevron-right"></i>
										</a>
									</li>

									<!-- Última -->
									<li class="page-item" th:classappend="${adolescentes.last} ? 'disabled'">
										<a class="page-link"
										   th:href="@{/adolescentes(
                        page=${adolescentes.totalPages - 1},
                        filtroNome=${filtro.filtroNome},
                        filtroApelido=${filtro.filtroApelido},
                        filtroCidade=${filtro.filtroCidade},
                        filtroCpf=${filtro.filtroCpf},
                        idadeMin=${filtro.idadeMin},
                        idadeMax=${filtro.idadeMax},
                        filtroStatus=${filtro.filtroStatus},
                        size=${filtro.size})}"
										   data-bs-toggle="tooltip" title="Última página">
											<i class="fa-duotone fa-solid fa-angles-right"></i>
										</a>
									</li>

								</ul>
							</nav>

						</div>

					</div>
				</div>

			</div>

		</div>

	</div>


</body>
</html>
