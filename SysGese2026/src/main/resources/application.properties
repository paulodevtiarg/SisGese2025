spring.application.name=SysGese2026
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Configurações do Driver do PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialeto (opcional em versões novas do Spring, mas ajuda a garantir)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# Desativa o relatório de condições e os logs de debug do Spring
debug=false

# Nível de log global (mostra só INFO pra frente)
logging.level.root=INFO

# Nível de log do seu pacote (ajuda a ver o que o seu código está fazendo)
logging.level.br.com.clinisys=INFO

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl

spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.thymeleaf.mode=html
spring.thymeleaf.cache=false
spring.config.import=optional:file:.env[.properties]
resend.api.key=${RESEND_API_KEY}
resend.from=${RESEND_FROM}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB


logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

server.tomcat.max-part-count=1000
spring.devtools.restart.enabled=true
# Opcional: timeout de sessão
server.servlet.session.timeout=30m
app.upload.base-dir=uploads

server.address=0.0.0.0
#server.port=${PORT:8080}
server.port=8080

# 🔥 Ajuste de pool para Aiven (ESSENCIAL)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1





